<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lego Pacotes — FGT Inteligência de Preços</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  margin: 0; padding: 0; background: #FAFAF7; color: #1F1F1D; font-size: 14px; line-height: 1.5;
}
.app { max-width: 1400px; margin: 0 auto; padding: 24px; }
header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #E5E3DC; }
header h1 { font-size: 20px; font-weight: 500; margin: 0; }
header .sub { font-size: 12px; color: #6B6A65; margin-top: 4px; }
.toolbar { display: flex; gap: 8px; }
button { font: inherit; background: transparent; border: 1px solid #D3D1C7; padding: 6px 12px; border-radius: 6px; cursor: pointer; color: #1F1F1D; transition: background .15s; }
button:hover { background: #F1EFE8; }
button.primary { background: #1F1F1D; color: #FAFAF7; border-color: #1F1F1D; }
button.primary:hover { background: #444441; }
button.danger { color: #791F1F; border-color: #F0C4C4; }
button.danger:hover { background: #FCEBEB; }
button.small { padding: 3px 8px; font-size: 12px; }
.tabs { display: flex; gap: 0; border-bottom: 1px solid #E5E3DC; margin-bottom: 20px; }
.tab { padding: 10px 18px; cursor: pointer; border: none; background: transparent; font-size: 14px; font-weight: 500; color: #6B6A65; border-bottom: 2px solid transparent; margin-bottom: -1px; border-radius: 0; }
.tab.active { color: #1F1F1D; border-bottom-color: #1F1F1D; }
.tab-content { display: none; }
.tab-content.active { display: block; }

.controls-row { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
.search-input { padding: 6px 10px; border: 1px solid #D3D1C7; border-radius: 6px; font: inherit; min-width: 200px; }
select { padding: 6px 10px; border: 1px solid #D3D1C7; border-radius: 6px; font: inherit; background: white; }

table { width: 100%; border-collapse: collapse; font-size: 13px; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 1px #E5E3DC; }
th { text-align: left; padding: 10px 8px; font-weight: 500; color: #6B6A65; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; background: #F7F5EE; border-bottom: 1px solid #E5E3DC; }
td { padding: 8px; border-bottom: 1px solid #F0EEE8; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #FBFAF5; }
td input, td select { width: 100%; border: 1px solid transparent; background: transparent; padding: 4px 6px; border-radius: 4px; font: inherit; }
td input:focus, td select:focus { background: #FFFCEC; border-color: #EF9F27; outline: none; }
td input[type=number] { text-align: right; }
td input[type=checkbox] { width: auto; }
.tipo-tag { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 500; }
.tipo-Atividade-Dia { background: #9FE1CB; color: #04342C; }
.tipo-Pacote-Base { background: #CECBF6; color: #26215C; }
.tipo-Trekking-Multi { background: #F5C4B3; color: #4A1B0C; }
.tipo-Trem { background: #ED93B1; color: #4B1528; }
.tipo-Hotel { background: #D3D1C7; color: #2C2C2A; }
.tipo-Ingresso { background: #FAC775; color: #412402; }
.tipo-Guia { background: #C0DD97; color: #173404; }
.tipo-Transfer { background: #E5E3DC; color: #444441; }
.tipo-Voo { background: #F09595; color: #501313; }
.tipo-Outro { background: #F1EFE8; color: #444441; }

.pacote-grid { display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
.pacote-list { background: white; border-radius: 8px; padding: 12px; box-shadow: 0 0 0 1px #E5E3DC; max-height: 70vh; overflow-y: auto; }
.pacote-item { padding: 10px 12px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; margin-bottom: 4px; }
.pacote-item:hover { background: #FBFAF5; }
.pacote-item.selected { background: #FFF7E3; border-color: #EF9F27; }
.pacote-item-name { font-weight: 500; font-size: 13px; }
.pacote-item-meta { font-size: 11px; color: #6B6A65; margin-top: 2px; }
.pacote-detail { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 0 0 1px #E5E3DC; }
.pacote-detail h2 { font-size: 18px; font-weight: 500; margin: 0 0 4px; }
.pacote-detail .meta-input { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; margin-bottom: 20px; }
.field-group { display: flex; flex-direction: column; gap: 4px; }
.field-group label { font-size: 11px; color: #6B6A65; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 500; }
.field-group input, .field-group select { padding: 6px 10px; border: 1px solid #D3D1C7; border-radius: 6px; font: inherit; }
.field-group input:focus, .field-group select:focus { outline: none; border-color: #EF9F27; background: #FFFCEC; }

.composicao { margin-top: 20px; }
.composicao h3 { font-size: 14px; font-weight: 500; margin: 0 0 10px; }
.peca-add-row { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
.peca-add-row select { flex: 1; }
.peca-add-row input[type=number] { width: 70px; padding: 6px 8px; border: 1px solid #D3D1C7; border-radius: 6px; font: inherit; }
.composicao-list { background: #FBFAF5; border-radius: 6px; padding: 8px; }
.composicao-row { display: grid; grid-template-columns: 28px 1fr 60px 80px 80px 80px 80px 30px; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 4px; font-size: 12px; }
.composicao-row:hover { background: white; }
.composicao-row.header { font-weight: 500; color: #6B6A65; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
.composicao-row input[type=number] { width: 50px; padding: 4px 6px; border: 1px solid #D3D1C7; border-radius: 4px; font: inherit; text-align: right; }

.totals { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 20px; }
.totals-card { background: #F7F5EE; border-radius: 8px; padding: 16px; }
.totals-card h4 { font-size: 12px; font-weight: 500; margin: 0 0 12px; color: #6B6A65; text-transform: uppercase; letter-spacing: 0.04em; }
.totals-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; }
.totals-row .label { color: #6B6A65; }
.totals-row .value { font-weight: 500; }
.totals-row.highlight { border-top: 1px solid #D3D1C7; padding-top: 8px; margin-top: 4px; }

.delta-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 16px; }
.delta-card { padding: 12px; border-radius: 8px; }
.delta-card .label { font-size: 11px; color: #6B6A65; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
.delta-card .value { font-size: 20px; font-weight: 500; }
.delta-card .sub { font-size: 11px; color: #6B6A65; margin-top: 2px; }
.delta-positive { background: #EAF3DE; }
.delta-positive .value { color: #173404; }
.delta-negative { background: #FCEBEB; }
.delta-negative .value { color: #501313; }
.delta-neutral { background: #F1EFE8; }
.delta-neutral .value { color: #444441; }

.empty-state { padding: 40px; text-align: center; color: #6B6A65; }
.checkbox-wrap { display: flex; align-items: center; gap: 4px; }

.dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 24px; }
.metric-card { background: white; padding: 16px; border-radius: 8px; box-shadow: 0 0 0 1px #E5E3DC; }
.metric-card .label { font-size: 11px; color: #6B6A65; text-transform: uppercase; letter-spacing: 0.04em; }
.metric-card .value { font-size: 24px; font-weight: 500; margin: 6px 0 2px; }
.metric-card .sub { font-size: 12px; color: #6B6A65; }

.dashboard-section { background: white; border-radius: 8px; padding: 20px; margin-bottom: 16px; box-shadow: 0 0 0 1px #E5E3DC; }
.dashboard-section h3 { font-size: 14px; font-weight: 500; margin: 0 0 12px; }
.toast { position: fixed; bottom: 24px; right: 24px; background: #1F1F1D; color: #FAFAF7; padding: 10px 16px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; }
.toast.show { opacity: 1; }

.help-text { font-size: 12px; color: #6B6A65; margin-bottom: 12px; line-height: 1.5; }
.help-text code { background: #F1EFE8; padding: 1px 5px; border-radius: 3px; font-size: 11px; font-family: ui-monospace, "SF Mono", monospace; }

.flag-yes { color: #173404; font-weight: 500; }
.flag-no { color: #6B6A65; }
.numeric { text-align: right; font-variant-numeric: tabular-nums; }

/* ====== ABA MONTAR ====== */
.montar-header { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
.montar-header select { min-width: 280px; padding: 8px 12px; font-size: 14px; }
.montar-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; align-items: start; }
.paleta-wrap, .montagem-wrap { background: white; border-radius: 12px; padding: 16px; box-shadow: 0 0 0 1px #E5E3DC; }
.paleta-wrap h3, .montagem-wrap h3 { font-size: 13px; font-weight: 500; margin: 0 0 12px; color: #6B6A65; text-transform: uppercase; letter-spacing: 0.06em; }
.paleta-filtro { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.paleta-filtro button { padding: 4px 10px; font-size: 11px; border-radius: 99px; }
.paleta-filtro button.active { background: #1F1F1D; color: #FAFAF7; border-color: #1F1F1D; }

.paleta-grupo { margin-bottom: 14px; }
.paleta-grupo-titulo { font-size: 11px; font-weight: 500; color: #6B6A65; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
.paleta-grupo-blocos { display: flex; flex-wrap: wrap; gap: 6px; }
.bloco {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 10px; border-radius: 6px;
  font-size: 12px; font-weight: 500;
  cursor: pointer; transition: transform .12s, box-shadow .12s;
  border: 1px solid transparent;
  user-select: none;
}
.bloco:hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.bloco:active { transform: translateY(0) scale(0.96); }
.bloco .bloco-nome { line-height: 1.2; }
.bloco .bloco-preco { font-weight: 400; font-size: 11px; opacity: 0.75; }
.bloco .bloco-add { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 99px; background: rgba(255,255,255,0.6); font-size: 14px; font-weight: 500; }
.bloco.paleta-Atividade-Dia { background: #9FE1CB; color: #04342C; border-color: #1D9E75; }
.bloco.paleta-Pacote-Base { background: #CECBF6; color: #26215C; border-color: #7F77DD; }
.bloco.paleta-Trekking-Multi { background: #F5C4B3; color: #4A1B0C; border-color: #D85A30; }
.bloco.paleta-Trem { background: #ED93B1; color: #4B1528; border-color: #D4537E; }
.bloco.paleta-Hotel { background: #D3D1C7; color: #2C2C2A; border-color: #888780; }
.bloco.paleta-Ingresso { background: #FAC775; color: #412402; border-color: #BA7517; }
.bloco.paleta-Guia { background: #C0DD97; color: #173404; border-color: #639922; }
.bloco.paleta-Transfer { background: #E5E3DC; color: #444441; border-color: #B4B2A9; }
.bloco.paleta-Voo { background: #F09595; color: #501313; border-color: #E24B4A; }
.bloco.paleta-Outro { background: #F1EFE8; color: #444441; border-color: #B4B2A9; }
.bloco.status-a-cadastrar { opacity: 0.55; border-style: dashed; }
.bloco.status-a-cadastrar::after { content: ' ⏳'; }
.bloco.status-rascunho { border-style: dashed; }
.bloco.status-rascunho::after { content: ' ✎'; font-size: 10px; opacity: 0.6; }

.caixa-pacote { background: #FBFAF5; border: 2px dashed #D3D1C7; border-radius: 12px; padding: 14px; min-height: 200px; }
.caixa-pacote.has-items { border-style: solid; border-color: #C0DD97; background: #F7FBF0; }
.caixa-vazia { text-align: center; color: #9B9994; font-size: 13px; padding: 40px 20px; }
.caixa-vazia i { font-size: 22px; display: block; margin-bottom: 6px; opacity: 0.5; }
.bloco-no-pacote { display: flex; align-items: center; gap: 8px; padding: 8px 10px; margin-bottom: 4px; border-radius: 6px; border: 1px solid transparent; font-size: 12px; }
.bloco-no-pacote .bloco-tipo-tag { width: 4px; height: 28px; border-radius: 2px; flex-shrink: 0; }
.bloco-no-pacote .bloco-info { flex: 1; min-width: 0; }
.bloco-no-pacote .bloco-info-nome { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bloco-no-pacote .bloco-info-tipo { font-size: 10px; color: #6B6A65; }
.bloco-no-pacote .qty-controls { display: flex; align-items: center; gap: 4px; }
.bloco-no-pacote .qty-btn { width: 24px; height: 24px; border-radius: 4px; border: 1px solid #D3D1C7; background: white; cursor: pointer; font-size: 14px; line-height: 1; display: flex; align-items: center; justify-content: center; padding: 0; }
.bloco-no-pacote .qty-btn:hover { background: #F1EFE8; }
.bloco-no-pacote .qty-display { min-width: 24px; text-align: center; font-weight: 500; }
.bloco-no-pacote .remover { color: #791F1F; cursor: pointer; padding: 4px; }
.bloco-no-pacote .preco-bloco { font-size: 11px; color: #6B6A65; font-variant-numeric: tabular-nums; min-width: 50px; text-align: right; }

.resumo-mini { background: white; border-radius: 8px; padding: 12px; margin-top: 14px; border: 1px solid #E5E3DC; }
.resumo-mini-row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 12px; }
.resumo-mini-row.destaque { font-weight: 500; border-top: 1px solid #E5E3DC; padding-top: 6px; margin-top: 4px; font-size: 13px; }
.resumo-mini-row .resumo-label { color: #6B6A65; }
.delta-badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 500; }
.delta-badge.pos { background: #EAF3DE; color: #173404; }
.delta-badge.neg { background: #FCEBEB; color: #501313; }
.delta-badge.neu { background: #F1EFE8; color: #444441; }

@keyframes flyIn { 0% { transform: scale(1.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.bloco-no-pacote.just-added { animation: flyIn .25s ease-out; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Lego Pacotes — FGT Inteligência de Preços</h1>
      <div class="sub">Cadastre peças, monte pacotes, compare custos e preços. Dados persistidos localmente no navegador.</div>
    </div>
    <div class="toolbar">
      <button onclick="exportData()">Exportar JSON</button>
      <button onclick="document.getElementById('import-file').click()">Importar JSON</button>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)" />
      <button class="danger" onclick="resetData()">Resetar ao padrão</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="dashboard">Resumo</button>
    <button class="tab" data-tab="montar">Montar (blocos)</button>
    <button class="tab" data-tab="pecas">Peças</button>
    <button class="tab" data-tab="pacotes">Pacotes</button>
  </nav>

  <section id="tab-dashboard" class="tab-content active"></section>
  <section id="tab-montar" class="tab-content"></section>
  <section id="tab-pecas" class="tab-content"></section>
  <section id="tab-pacotes" class="tab-content"></section>
</div>
<div class="toast" id="toast"></div>

<script>
// ===========================================================================
// DADOS PADRÃO v2 — peças atômicas indivisíveis baseadas em
// "Preços e Custo Cusco - Kantu - Cruzamento BDT × SoftTur.csv" (mai/2026)
// ===========================================================================
// Tipos:
//   - Atividade-Dia      = tour de 1 dia vendido avulso (City Tour, Maras, Rainbow…)
//   - Pacote-Base        = operação multi-dia Kantu (NET puro, sem hotel/trem/ingresso)
//   - Trekking-Multi     = trekking multi-dia (já inclui hospedagem/alimentação)
//   - Trem               = bilhete trem (independente)
//   - Hotel              = noite (por pessoa em quarto duplo, NET base)
//   - Ingresso           = entrada Machu Picchu
//   - Guia               = serviço de guia privado
//   - Transfer           = transfer aeroporto/hotel
const DEFAULT_PECAS_OLD = [
  // Tours dia Cusco (vendidos avulsos pela Kantu B2C)
  { id: 'cusco-city',    nome: 'Cusco City Tour',           tipo: 'Tour-Cusco',        unidade: 'pessoa', custo_kantu: 0,  custo_direto: 0,  preco_fgt: 0, preco_mercado: 18,  avulso_kantu: true,  avulso_fgt: true,  notas: 'Half day, easy. SoftTur 25557-25783.' },
  { id: 'sacred-valley', nome: 'Vale Sagrado',              tipo: 'Tour-Cusco',        unidade: 'pessoa', custo_kantu: 0,  custo_direto: 0,  preco_fgt: 0, preco_mercado: 35,  avulso_kantu: true,  avulso_fgt: true,  notas: 'Full day. Bestseller.' },
  { id: 'maras-moray',   nome: 'Maras & Moray',             tipo: 'Tour-Cusco',        unidade: 'pessoa', custo_kantu: 0,  custo_direto: 0,  preco_fgt: 0, preco_mercado: 25,  avulso_kantu: true,  avulso_fgt: true,  notas: '1 day, easy.' },
  { id: 'south-valley',  nome: 'South Valley Tour',         tipo: 'Tour-Cusco',        unidade: 'pessoa', custo_kantu: 0,  custo_direto: 0,  preco_fgt: 0, preco_mercado: 25,  avulso_kantu: true,  avulso_fgt: true,  notas: 'Half day.' },
  { id: 'super-valle',   nome: 'Super Vale Sagrado + Maras',tipo: 'Tour-Cusco',        unidade: 'pessoa', custo_kantu: 0,  custo_direto: 0,  preco_fgt: 0, preco_mercado: 42,  avulso_kantu: true,  avulso_fgt: false, notas: '' },
  { id: 'qeswachaka',    nome: 'Qeswachaka (ponte inca)',   tipo: 'Tour-Cusco',        unidade: 'pessoa', custo_kantu: 0,  custo_direto: 0,  preco_fgt: 0, preco_mercado: 45,  avulso_kantu: true,  avulso_fgt: false, notas: 'Privado.' },
  { id: 'pisaq',         nome: 'Pisaq (mercado + ruínas)',  tipo: 'Tour-Cusco',        unidade: 'pessoa', custo_kantu: 0,  custo_direto: 0,  preco_fgt: 0, preco_mercado: 25,  avulso_kantu: true,  avulso_fgt: false, notas: '' },
  { id: 'cooking',       nome: 'Cooking Class Cusco',       tipo: 'Tour-Cusco',        unidade: 'pessoa', custo_kantu: 0,  custo_direto: 0,  preco_fgt: 0, preco_mercado: 99,  avulso_kantu: true,  avulso_fgt: false, notas: 'Premium.' },
  { id: 'cusco-viewpoints', nome: 'Cusco Viewpoints (privado)',tipo: 'Tour-Cusco',     unidade: 'pessoa', custo_kantu: 0,  custo_direto: 0,  preco_fgt: 0, preco_mercado: 120, avulso_kantu: true,  avulso_fgt: false, notas: '' },

  // Aventura Cusco
  { id: 'rainbow',       nome: 'Rainbow Mountain (Vinicunca)',tipo: 'Aventura',       unidade: 'pessoa', custo_kantu: 0,  custo_direto: 0,  preco_fgt: 0, preco_mercado: 35,  avulso_kantu: true,  avulso_fgt: true,  notas: '1 day, moderate.' },
  { id: 'humantay',      nome: 'Humantay Lake (1 dia)',     tipo: 'Aventura',          unidade: 'pessoa', custo_kantu: 0,  custo_direto: 0,  preco_fgt: 0, preco_mercado: 35,  avulso_kantu: true,  avulso_fgt: true,  notas: '1 day, moderate.' },
  { id: 'chonta',        nome: 'Flight of the Condor (Chonta)',tipo:'Aventura',        unidade: 'pessoa', custo_kantu: 0,  custo_direto: 0,  preco_fgt: 0, preco_mercado: 70,  avulso_kantu: true,  avulso_fgt: false, notas: '' },

  // Aventura extrema Cusco
  { id: 'atv-maras',     nome: 'ATV Maras Moray',           tipo: 'Aventura-Extrema',  unidade: 'pessoa', custo_kantu: 0,  custo_direto: 0,  preco_fgt: 0, preco_mercado: 55,  avulso_kantu: true,  avulso_fgt: false, notas: 'SoftTur 25779,25566,25567,25687.' },
  { id: 'atv-abode',     nome: 'ATV Abode of the Gods',     tipo: 'Aventura-Extrema',  unidade: 'pessoa', custo_kantu: 0,  custo_direto: 0,  preco_fgt: 0, preco_mercado: 20,  avulso_kantu: true,  avulso_fgt: false, notas: '' },

// ===========================================================================
// ESTADO / PERSISTÊNCIA
// ===========================================================================
const STORAGE_KEY = 'lego-pacotes-fgt-v3';
let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      // Migração defensiva: garantir campos novos em peças antigas
      if (data.pecas) data.pecas.forEach(p => {
        if (p.custo_kantu_avulso === undefined) p.custo_kantu_avulso = p.custo_kantu || 0;
        if (!p.status) p.status = 'ativo';
        if (p.softtur_id === undefined) p.softtur_id = '';
        if (p.bdt_codigo === undefined) p.bdt_codigo = '';
        if (p.preco_tabela_brl === undefined) p.preco_tabela_brl = 0;
      });
      return data;
    }
  } catch (e) { console.warn('loadState error', e); }
  return { pecas: DEFAULT_PECAS.map(p => ({status: 'ativo', custo_kantu_avulso: p.custo_kantu, ...p})), pacotes: DEFAULT_PACOTES.map(p => ({...p, composicao: p.composicao.map(c=>({...c}))})), selectedPacoteId: null };
}
function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
function resetData() {
  if (!confirm('Resetar TODOS os dados ao padrão? Suas edições serão perdidas.')) return;
  state = { pecas: DEFAULT_PECAS.map(p => ({status: 'ativo', custo_kantu_avulso: p.custo_kantu, ...p})), pacotes: DEFAULT_PACOTES.map(p => ({...p, composicao: p.composicao.map(c=>({...c}))})), selectedPacoteId: null };
  saveState(); render();
  toast('Dados resetados ao padrão.');
}
function exportData() {
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `lego-pacotes-fgt-${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('JSON exportado.');
}
function importData(e) {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.pecas || !data.pacotes) throw new Error('Estrutura inválida');
      state = data;
      saveState(); render();
      toast('JSON importado com sucesso.');
    } catch (err) { alert('Erro ao importar: ' + err.message); }
  };
  reader.readAsText(f);
}

// ===========================================================================
// CÁLCULOS
// ===========================================================================
function getPeca(id) { return state.pecas.find(p => p.id === id); }
function fmt(n) { return n.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0}); }
function fmtPct(n) { return (n >= 0 ? '+' : '') + n.toFixed(0) + '%'; }

function calcPacote(pacote) {
  let soma_custo_kantu = 0, soma_custo_direto = 0, soma_preco_fgt = 0, soma_preco_mercado = 0;
  for (const item of (pacote.composicao || [])) {
    const peca = getPeca(item.peca_id);
    if (!peca) continue;
    soma_custo_kantu   += (peca.custo_kantu   || 0) * item.qty;
    soma_custo_direto  += (peca.custo_direto  || 0) * item.qty;
    soma_preco_fgt     += (peca.preco_fgt     || 0) * item.qty;
    soma_preco_mercado += (peca.preco_mercado || 0) * item.qty;
  }
  return {
    soma_custo_kantu, soma_custo_direto, soma_preco_fgt, soma_preco_mercado,
    delta_kantu_mercado: (pacote.preco_kantu_b2c || 0) - soma_preco_mercado,
    delta_pct_kantu_mercado: soma_preco_mercado > 0 ? ((pacote.preco_kantu_b2c - soma_preco_mercado) / soma_preco_mercado * 100) : 0,
    delta_fgt: (pacote.preco_fgt_pacote || 0) - soma_preco_fgt,
    delta_pct_fgt: soma_preco_fgt > 0 ? ((pacote.preco_fgt_pacote - soma_preco_fgt) / soma_preco_fgt * 100) : 0,
    margem_fgt: (pacote.preco_fgt_pacote || 0) - (pacote.custo_fgt_pacote || 0),
    margem_pct_fgt: (pacote.custo_fgt_pacote || 0) > 0 ? (((pacote.preco_fgt_pacote || 0) - pacote.custo_fgt_pacote) / pacote.custo_fgt_pacote * 100) : 0,
    delta_custo_kantu: (pacote.custo_kantu_pacote || 0) - soma_custo_kantu
  };
}

          return `
            <div class="composicao-row">
              <div><span class="tipo-tag tipo-${peca.tipo}">${peca.tipo.charAt(0)}</span></div>
              <div>${peca.nome}<div style="font-size:10px;color:#9B9994">${peca.unidade}</div></div>
              <div class="numeric"><input type="number" min="1" value="${item.qty}" onchange="updateComposicao('${pacote.id}',${idx},+this.value)" /></div>
              <div class="numeric">$${fmt((peca.custo_kantu||0)*item.qty)}</div>
              <div class="numeric">$${fmt((peca.custo_direto||0)*item.qty)}</div>
              <div class="numeric">$${fmt((peca.preco_fgt||0)*item.qty)}</div>
              <div class="numeric">$${fmt((peca.preco_mercado||0)*item.qty)}</div>
              <div><button class="small danger" onclick="removePecaFromPacote('${pacote.id}',${idx})" title="Remover">×</button></div>
            </div>`;
        }).join('')}
      </div>
    </div>

    <div class="totals">
      <div class="totals-card">
        <h4>Soma das peças individuais</h4>
        <div class="totals-row"><span class="label">Custo Kantu (NET)</span><span class="value">$${fmt(c.soma_custo_kantu)}</span></div>
        <div class="totals-row"><span class="label">Custo Direto</span><span class="value">$${fmt(c.soma_custo_direto)}</span></div>
        <div class="totals-row"><span class="label">Preço FGT (avulsos)</span><span class="value">$${fmt(c.soma_preco_fgt)}</span></div>
        <div class="totals-row highlight"><span class="label">Preço Mercado (avulsos)</span><span class="value">$${fmt(c.soma_preco_mercado)}</span></div>
      </div>
      <div class="totals-card">
        <h4>Pacote consolidado</h4>
        <div class="totals-row"><span class="label">Custo Kantu pacote</span><span class="value">$${fmt(pacote.custo_kantu_pacote||0)}</span></div>
        <div class="totals-row"><span class="label">Custo FGT pacote</span><span class="value">$${fmt(pacote.custo_fgt_pacote||0)}</span></div>
        <div class="totals-row"><span class="label">Preço FGT pacote</span><span class="value">$${fmt(pacote.preco_fgt_pacote||0)}</span></div>
        <div class="totals-row highlight"><span class="label">Preço B2C Kantu</span><span class="value">$${fmt(pacote.preco_kantu_b2c||0)}</span></div>
      </div>
    </div>

    <div class="delta-grid">
      ${deltaCard('Prêmio Kantu (B2C vs soma)', c.delta_kantu_mercado, fmtPct(c.delta_pct_kantu_mercado))}
      ${deltaCard('Prêmio FGT (pacote vs soma)', c.delta_fgt, fmtPct(c.delta_pct_fgt))}
      ${deltaCard('Margem absoluta FGT', c.margem_fgt, c.margem_pct_fgt ? fmtPct(c.margem_pct_fgt) + ' sobre custo' : 'preencha custo FGT')}
      ${deltaCard('Delta Custo Kantu (pacote vs soma)', c.delta_custo_kantu, c.delta_custo_kantu===0 ? 'preencha custo NET' : 'NET pacote vs NET peças')}
    </div>
  `;
}

// ===========================================================================
// AÇÕES
// ===========================================================================
function updatePeca(id, field, value) {
  const p = getPeca(id); if (!p) return;
  p[field] = value;
  saveState();
  if (field === 'nome' || field === 'tipo') renderPacotes();
}
function deletePeca(id) {
  const used = state.pacotes.some(p => p.composicao.some(c => c.peca_id === id));
  if (used && !confirm('Esta peça está em uso em pacotes. Excluir mesmo assim?')) return;
  state.pecas = state.pecas.filter(p => p.id !== id);
  saveState(); renderPecas(); renderDashboard();
}
function addPeca() {
  const nome = prompt('Nome da nova peça:'); if (!nome) return;
  const id = nome.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  if (state.pecas.some(p => p.id === id)) return alert('Já existe peça com esse ID.');
  state.pecas.push({ id, nome, tipo: 'Outro', status: 'a-cadastrar', softtur_id: '', bdt_codigo: '', unidade: 'pessoa', custo_kantu: 0, custo_kantu_avulso: 0, custo_direto: 0, preco_fgt: 0, preco_mercado: 0, preco_tabela_brl: 0, avulso_kantu: false, avulso_fgt: false, notas: '' });
  saveState(); renderPecas(); renderDashboard();
}

function updatePacote(id, field, value) {
  const p = state.pacotes.find(x => x.id === id); if (!p) return;
  p[field] = value;
  saveState();
  if (field === 'nome' || field === 'dias') renderPacotes();
  else renderPacoteDetailOnly(id);
}
function renderPacoteDetailOnly(id) {
  const p = state.pacotes.find(x => x.id === id); if (!p) return;
  const detail = document.querySelector('.pacote-detail');
  if (detail) detail.innerHTML = renderPacoteDetail(p);
  // atualizar contador no item lateral
  const items = document.querySelectorAll('.pacote-item');
  items.forEach(el => {
    const onclick = el.getAttribute('onclick');
    if (onclick && onclick.includes(`'${id}'`)) {
      const c = calcPacote(p);
      const meta = el.querySelector('.pacote-item-meta');
      if (meta) meta.textContent = `${p.dias}d · ${p.composicao.length} peças · $${fmt(p.preco_kantu_b2c||0)} Kantu`;
    }
  });
}
function deletePacote(id) {
  if (!confirm('Excluir este pacote?')) return;
  state.pacotes = state.pacotes.filter(p => p.id !== id);
  state.selectedPacoteId = state.pacotes[0]?.id || null;
  saveState(); renderPacotes(); renderDashboard();
}
function addPacote() {
  const nome = prompt('Nome do novo pacote:'); if (!nome) return;
  const id = nome.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  if (state.pacotes.some(p => p.id === id)) return alert('Já existe pacote com esse ID.');
  state.pacotes.push({ id, nome, bdt_codigo: '', dias: 1, composicao: [], preco_kantu_b2c: 0, custo_kantu_pacote: 0, preco_fgt_pacote: 0, custo_fgt_pacote: 0, preco_tabela_brl: 0, preco_tabela_fgt_brl: 0, notas: '' });
  state.selectedPacoteId = id;
  saveState(); renderPacotes(); renderDashboard();
}
function selectPacote(id) {
  state.selectedPacoteId = id;
  saveState(); renderPacotes();
}
function addPecaToPacote(pacoteId) {
  const sel = document.getElementById('add-peca-select-' + pacoteId);
  const qtyEl = document.getElementById('add-peca-qty-' + pacoteId);
  if (!sel.value) return alert('Selecione uma peça.');
  const qty = +qtyEl.value || 1;
  const p = state.pacotes.find(x => x.id === pacoteId);
  const exist = p.composicao.find(c => c.peca_id === sel.value);
  if (exist) exist.qty += qty;
  else p.composicao.push({ peca_id: sel.value, qty });
  saveState(); renderPacoteDetailOnly(pacoteId);
}
function removePecaFromPacote(pacoteId, idx) {
  const p = state.pacotes.find(x => x.id === pacoteId);
  p.composicao.splice(idx, 1);
  saveState(); renderPacoteDetailOnly(pacoteId);
}
function updateComposicao(pacoteId, idx, qty) {
  const p = state.pacotes.find(x => x.id === pacoteId);
  if (qty < 1) qty = 1;
  p.composicao[idx].qty = qty;
  saveState(); renderPacoteDetailOnly(pacoteId);
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ===========================================================================
// ABA MONTAR — visão ELI5 com blocos coloridos
// ===========================================================================
function renderMontar() {
  const el = document.getElementById('tab-montar');
  const selectedId = state.montarPacoteId || state.pacotes[0]?.id;
  const pacote = state.pacotes.find(p => p.id === selectedId);
  if (!pacote) { el.innerHTML = '<div class="empty-state">Crie um pacote primeiro na aba Pacotes.</div>'; return; }

  const tipoFilter = state.montarTipoFilter || 'todos';
  const tipos = ['Pacote-Base','Atividade-Dia','Trekking-Multi','Trem','Hotel','Ingresso','Guia','Transfer'];
  const todosOuFiltro = tipoFilter === 'todos';

  // Agrupar peças por tipo
  const pecasFiltradas = state.pecas.filter(p => todosOuFiltro || p.tipo === tipoFilter);
  const grupos = {};
  for (const p of pecasFiltradas) {
    if (!grupos[p.tipo]) grupos[p.tipo] = [];
    grupos[p.tipo].push(p);
  }
  const tiposOrdenados = tipos.filter(t => grupos[t]);

  const c = calcPacote(pacote);
  const deltaCls = c.delta_pct_kantu_mercado > 5 ? 'pos' : c.delta_pct_kantu_mercado < -5 ? 'neg' : 'neu';

  el.innerHTML = `
    <div class="montar-header">
      <select onchange="state.montarPacoteId=this.value; saveState(); renderMontar()">
        ${state.pacotes.map(p => `<option value="${p.id}" ${p.id===selectedId?'selected':''}>${p.nome} · $${fmt(p.preco_kantu_b2c||0)}</option>`).join('')}
      </select>
      <button onclick="addPacoteFromMontar()">+ Novo pacote</button>
      <button onclick="clearPacote('${pacote.id}')">Limpar peças</button>
      <span class="help-text" style="margin-left:auto">Clique em um bloco para adicionar. Cada clique = +1 unidade.</span>
    </div>

    <div class="montar-grid">
      <div class="paleta-wrap">
        <h3>Paleta de peças — clique para adicionar</h3>
        <div class="paleta-filtro">
          <button class="${tipoFilter==='todos'?'active':''}" onclick="state.montarTipoFilter='todos'; renderMontar()">Todos</button>
          ${tipos.map(t => `<button class="${tipoFilter===t?'active':''}" onclick="state.montarTipoFilter='${t}'; renderMontar()">${t}</button>`).join('')}
        </div>
        ${tiposOrdenados.map(tipo => `
          <div class="paleta-grupo">
            <div class="paleta-grupo-titulo">${tipo} (${grupos[tipo].length})</div>
            <div class="paleta-grupo-blocos">
              ${grupos[tipo].map(p => {
                const statusCls = (p.status && p.status !== 'ativo') ? ` status-${p.status}` : '';
                const titleText = ((p.status==='a-cadastrar' ? 'A CADASTRAR · ' : p.status==='rascunho' ? 'RASCUNHO · ' : '') + (p.notas||'')).replace(/"/g,'&quot;');
                return `<span class="bloco paleta-${p.tipo}${statusCls}" onclick="adicionarBloco('${pacote.id}','${p.id}')" title="${titleText}">
                  <span class="bloco-add">+</span>
                  <span class="bloco-nome">${p.nome}</span>
                  <span class="bloco-preco">$${fmt(p.custo_kantu||p.preco_mercado||0)}</span>
                </span>`;
              }).join('')}
            </div>
          </div>`).join('')}
      </div>

      <div class="montagem-wrap">
        <h3>${pacote.nome}</h3>
        <div style="font-size:12px;color:#6B6A65;margin-bottom:10px">${pacote.dias} dia${pacote.dias>1?'s':''} · ${pacote.composicao.reduce((s,c)=>s+c.qty,0)} peças no total · preço Kantu publicado: <strong>$${fmt(pacote.preco_kantu_b2c||0)}</strong></div>

        <div class="caixa-pacote ${pacote.composicao.length?'has-items':''}">
          ${pacote.composicao.length === 0
            ? `<div class="caixa-vazia">📦<br/>Caixa vazia. Clique em uma peça à esquerda para começar a montar.</div>`
            : pacote.composicao.map((item, idx) => {
                const peca = getPeca(item.peca_id);
                if (!peca) return `<div class="bloco-no-pacote" style="border-color:#F0C4C4"><div class="bloco-info"><div class="bloco-info-nome">⚠ Peça ${item.peca_id} não existe</div></div><span class="remover" onclick="removePecaFromPacote('${pacote.id}',${idx}); renderMontar()">×</span></div>`;
                const corBloco = `var(--${peca.tipo})`;
                return `
                  <div class="bloco-no-pacote" data-peca="${item.peca_id}" style="background:#FBFAF5">
                    <div class="bloco-tipo-tag" style="background:${tipoCor(peca.tipo)}"></div>
                    <div class="bloco-info">
                      <div class="bloco-info-nome">${peca.nome}</div>
                      <div class="bloco-info-tipo">${peca.tipo} · ${peca.unidade}</div>
                    </div>
                    <div class="qty-controls">
                      <button class="qty-btn" onclick="changeQty('${pacote.id}',${idx},-1)" title="−1">−</button>
                      <span class="qty-display">${item.qty}</span>
                      <button class="qty-btn" onclick="changeQty('${pacote.id}',${idx},1)" title="+1">+</button>
                    </div>
                    <div class="preco-bloco">$${fmt((peca.preco_mercado||0)*item.qty)}</div>
                    <span class="remover" onclick="removePecaFromPacote('${pacote.id}',${idx}); renderMontar()" title="Remover">×</span>
                  </div>`;
              }).join('')
          }
        </div>

        <div class="resumo-mini">
          ${(() => {
            // Validador NET pacote informado vs soma calculada
            const netInformado = pacote.custo_kantu_pacote || 0;
            const somaNet = c.soma_custo_kantu;
            const diffNet = netInformado - somaNet;
            let validCls = 'neu', validMsg = 'sem NET informado';
            if (netInformado > 0 && somaNet > 0) {
              if (Math.abs(diffNet) < 5) { validCls = 'pos'; validMsg = 'BATE com soma das peças'; }
              else if (diffNet < 0) { validCls = 'pos'; validMsg = `Kantu absorve $${fmt(Math.abs(diffNet))} (desconto pacote)`; }
              else { validCls = 'neg'; validMsg = `Kantu cobra $${fmt(diffNet)} a mais que a soma`; }
            }
            return `
              <div class="resumo-mini-row"><span class="resumo-label">Soma NET Kantu (peças)</span><span>$${fmt(somaNet)}</span></div>
              <div class="resumo-mini-row"><span class="resumo-label">NET Kantu pacote informado</span><span>$${fmt(netInformado)}</span></div>
              <div class="resumo-mini-row destaque">
                <span>Validador NET</span>
                <span><span class="delta-badge ${validCls}">${validMsg}</span></span>
              </div>
            `;
          })()}
          <div class="resumo-mini-row" style="margin-top:8px"><span class="resumo-label">Soma custo direto</span><span>$${fmt(c.soma_custo_direto)}</span></div>
          <div class="resumo-mini-row"><span class="resumo-label">Soma preço mercado avulso</span><span>$${fmt(c.soma_preco_mercado)}</span></div>
          <div class="resumo-mini-row destaque">
            <span>Preço B2C Kantu vs soma mercado</span>
            <span><span class="delta-badge ${deltaCls}">${c.delta_kantu_mercado>=0?'+':''}$${fmt(Math.abs(c.delta_kantu_mercado))} · ${fmtPct(c.delta_pct_kantu_mercado)}</span></span>
          </div>
        </div>
      </div>
    </div>
  `;
}

function tipoCor(tipo) {
  const m = {
    'Atividade-Dia': '#1D9E75', 'Pacote-Base': '#7F77DD', 'Trekking-Multi': '#D85A30',
    'Trem': '#D4537E', 'Hotel': '#888780', 'Ingresso': '#BA7517',
    'Guia': '#639922', 'Transfer': '#B4B2A9', 'Voo': '#E24B4A', 'Outro': '#B4B2A9'
  };
  return m[tipo] || '#B4B2A9';
}

function adicionarBloco(pacoteId, pecaId) {
  const p = state.pacotes.find(x => x.id === pacoteId);
  const exist = p.composicao.find(c => c.peca_id === pecaId);
  if (exist) exist.qty += 1;
  else p.composicao.push({ peca_id: pecaId, qty: 1 });
  saveState(); renderMontar();
  // animação no bloco adicionado
  setTimeout(() => {
    const el = document.querySelector(`.bloco-no-pacote[data-peca="${pecaId}"]`);
    if (el) { el.classList.add('just-added'); setTimeout(()=>el.classList.remove('just-added'), 300); }
  }, 0);
}

function changeQty(pacoteId, idx, delta) {
  const p = state.pacotes.find(x => x.id === pacoteId);
  p.composicao[idx].qty += delta;
  if (p.composicao[idx].qty <= 0) p.composicao.splice(idx, 1);
  saveState(); renderMontar();
}

function clearPacote(pacoteId) {
  if (!confirm('Esvaziar a caixa de peças deste pacote?')) return;
  const p = state.pacotes.find(x => x.id === pacoteId);
  p.composicao = [];
  saveState(); renderMontar();
}

function addPacoteFromMontar() {
  addPacote();
  state.montarPacoteId = state.pacotes[state.pacotes.length-1]?.id;
  saveState(); renderMontar();
}

function render() {
  renderDashboard();
  renderMontar();
  renderPecas();
  renderPacotes();
}

// Tabs
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

render();
</script>
</body>
</html>
